        const canvas = document.getElementById("sky");
        const context = canvas.getContext("2d");
        let width = 0;
        let height = 0;
        let pixelRatio = 1;
        let lastFrameTime = 0;

        // Future visual effects can append { update(frame), draw(context, frame) } here.
        // They are updated and drawn in this order each animation frame.
        const layers = [];

        const radians = Math.PI / 180;
        const latitude = LAT * radians;
        const sinLatitude = Math.sin(latitude);
        const cosLatitude = Math.cos(latitude);
        // Star twinkle: each star mixes three sines at its own rates, one from
        // each band (0.10-0.30, 0.40-0.80 and 1.00-1.50 Hz), with phases and
        // rates drawn from the seeded LCG below, so every star flickers with
        // its own rhythm and no organised wave can sweep the sky. The factor
        // is 1 + amplitude * S / sqrt(3/2), where S is the star's summed
        // sines: dividing by the RMS of three unit sines (sqrt(3/2) ~ 1.225)
        // makes the sum unit-RMS, so the altitude-scaled amplitude is the RMS
        // swing about a mean of exactly 1. The modulation is linear and
        // symmetric, so the mean brightness is unchanged (no vignette toward
        // the horizon) and no frequency doubling occurs.
        // Seeded LCG: the sky looks the same on every load (Math.random()
        // would reshuffle it).
        let twinkleSeed = 0x9e3779b9;
        const twinkleRandom = () =>
          (twinkleSeed = (1664525 * twinkleSeed + 1013904223) >>> 0) / 4294967296;
        const twinkleNormalise = 1 / Math.sqrt(1.5);

        const starCatalog = STARS.map(([rightAscension, declination, magnitude]) => {
          // One rate from each band, then one independent phase per component.
          const slowRate = 0.1 + 0.2 * twinkleRandom();
          const mediumRate = 0.4 + 0.4 * twinkleRandom();
          const fastRate = 1.0 + 0.5 * twinkleRandom();
          const twoPi = 2 * Math.PI;
          return {
            rightAscension: rightAscension * 15 * radians,
            sinDeclination: Math.sin(declination * radians),
            cosDeclination: Math.cos(declination * radians),
            magnitude,
            twinkleRate1: slowRate * twoPi,
            twinkleRate2: mediumRate * twoPi,
            twinkleRate3: fastRate * twoPi,
            twinklePhase1: twinkleRandom() * twoPi,
            twinklePhase2: twinkleRandom() * twoPi,
            twinklePhase3: twinkleRandom() * twoPi,
          };
        });

        function localSiderealTime(date) {
          const julianDate = date.getTime() / 86400000 + 2440587.5;
          const daysSinceJ2000 = julianDate - 2451545.0;
          const gmst = 280.46061837 + 360.98564736629 * daysSinceJ2000;
          return ((gmst + LON) % 360 + 360) % 360 * radians;
        }

        layers.push({
          draw(context, frame) {
            const siderealTime = localSiderealTime(new Date());
            const centerX = frame.width / 2;
            const centerY = frame.height / 2;
            // Zoomed to fill the whole frame: the projection covers the
            // corners, so the lowest sky near the horizon is cropped.
            const horizonRadius = Math.hypot(frame.width, frame.height) / 2;

            for (const star of starCatalog) {
              let hourAngle = siderealTime - star.rightAscension;
              hourAngle = ((hourAngle + Math.PI) % (2 * Math.PI)) - Math.PI;

              const sinAltitude =
                sinLatitude * star.sinDeclination +
                cosLatitude * star.cosDeclination * Math.cos(hourAngle);
              if (sinAltitude <= 0) continue;

              const altitude = Math.asin(sinAltitude);
              // Azimuth is measured clockwise from north: north remains at the top.
              const azimuth =
                Math.atan2(
                  Math.sin(hourAngle),
                  Math.cos(hourAngle) * sinLatitude -
                    (star.sinDeclination / star.cosDeclination) * cosLatitude,
                ) + Math.PI;
              // Equidistant zenith-centered projection: the horizon is the outer edge.
              // Looking UP at the sky (ceiling view): with north at the top,
              // east is on the LEFT, hence the minus sign (mirror of a paper map).
              const distance = ((Math.PI / 2 - altitude) / (Math.PI / 2)) * horizonRadius;
              const x = centerX - Math.sin(azimuth) * distance;
              const y = centerY - Math.cos(azimuth) * distance;
              // Faint stars are boosted relative to the raw flux: without the
              // radius floor (mag > 5.1) they shrink below a pixel and never
              // register. The divisor sets the slope: the brightest stars sit
              // near 1 whatever it is, so raising it lifts the faint and
              // middling stars only, which is where a projected sky reads as
              // too dim. The brightness floor is now a safety net that the
              // current mag-6 catalogue never reaches (mag 6 maps to 0.21).
              const brightness = Math.max(0.15, 1 - (star.magnitude + 1.5) / 9.5);
              // The twinkle swings harder the lower the star sits: the
              // amplitude grows linearly as sinAltitude falls, mirroring
              // airmass, the longer atmospheric path low stars are seen
              // through (about +/-18% RMS near the horizon vs +/-4% at the
              // zenith).
              const twinkleAmplitude = 0.18 - 0.14 * sinAltitude;
              const twinkleSum =
                Math.sin(frame.time * star.twinkleRate1 + star.twinklePhase1) +
                Math.sin(frame.time * star.twinkleRate2 + star.twinklePhase2) +
                Math.sin(frame.time * star.twinkleRate3 + star.twinklePhase3);
              const twinkle = 1 + twinkleAmplitude * twinkleNormalise * twinkleSum;

              // Only the few brightest stars ever push alpha past 1, and only
              // at twinkle peaks: a range guard, not a shaping curve.
              context.globalAlpha = Math.min(1, brightness * twinkle);
              context.fillStyle = "#fff";
              context.beginPath();
              context.arc(x, y, Math.max(0.48, 0.45 + (5.2 - star.magnitude) * 0.27), 0, 2 * Math.PI);
              context.fill();
            }
            context.globalAlpha = 1;
          },
        });

        // Draw this layer small and scale it up: the reduced resolution keeps the
        // many fine curtain rays inexpensive while retaining their soft glow.
        // This visual regresses easily: symmetric curtains, evenly spaced equal-width
        // filaments (an equaliser), hard vertical edges, neon saturation, a smooth dark
        // lower border (a mountain ridge), or uniform brightness without bright cores look fake.
        const auroraCanvas = document.createElement("canvas");
        const auroraContext = auroraCanvas.getContext("2d");
        const auroraBodyCanvas = document.createElement("canvas");
        const auroraBodyContext = auroraBodyCanvas.getContext("2d");
        const auroraFilamentCanvas = document.createElement("canvas");
        const auroraFilamentContext = auroraFilamentCanvas.getContext("2d");
        // Keep the fixed look controls together so future tuning does not require
        // tracing through the renderer.
        const auroraTuning = {
          brightness: 0.55,
          filamentStrength: 1.4,
          filamentDensity: 1.35,
          filamentSampleStep: 0.0075,
          bodySampleStride: 4,
          scale: 6,
          bodyLineWidth: 8,
          filamentLineWidth: 1.5,
          bodyBlur: 2.5,
          filamentBlur: 0.7,
          timeScale: 2,
        };
        const curtains = [
          { offset: 0.02, span: 0.56, baseStart: 0.80, baseEnd: 0.61, wobble: 0.018, waves: 11, phase: 0.63, direction: 1 },
          { offset: 0.40, span: 0.56, baseStart: 0.57, baseEnd: 0.76, wobble: 0.013, waves: 8, phase: 4.18, direction: -1 },
        ];
        const auroraRays = [];
        layers.push({
          update(frame) {
            const auroraWidth = Math.max(1, Math.ceil(frame.width / auroraTuning.scale));
            const auroraHeight = Math.max(1, Math.ceil(frame.height / auroraTuning.scale));
            if (auroraCanvas.width !== auroraWidth || auroraCanvas.height !== auroraHeight) {
              auroraCanvas.width = auroraWidth;
              auroraCanvas.height = auroraHeight;
              auroraBodyCanvas.width = auroraWidth;
              auroraBodyCanvas.height = auroraHeight;
              auroraFilamentCanvas.width = auroraWidth;
              auroraFilamentCanvas.height = auroraHeight;
            }
          },
          draw(context, frame) {
            const auroraWidth = auroraCanvas.width;
            const auroraHeight = auroraCanvas.height;
            const time = frame.time * auroraTuning.timeScale;
            auroraContext.clearRect(0, 0, auroraWidth, auroraHeight);
            auroraBodyContext.clearRect(0, 0, auroraWidth, auroraHeight);
            auroraFilamentContext.clearRect(0, 0, auroraWidth, auroraHeight);
            auroraBodyContext.globalCompositeOperation = "lighter";
            auroraFilamentContext.globalCompositeOperation = "lighter";
            auroraBodyContext.lineCap = "round";
            auroraFilamentContext.lineCap = "round";

            for (const curtain of curtains) {
              // Sample uniformly in t, not x: where dx/dt is small, rays bunch and
              // overlap into folds. Do not simplify this back to uniform-x sampling.
              let rayCount = 0;
              for (let t = 0; t <= 1; t += auroraTuning.filamentSampleStep) {
                const edgeFade = Math.pow(Math.sin(Math.PI * t), 0.8);
                const x = auroraWidth * (
                  curtain.offset +
                  curtain.span * t +
                  curtain.wobble * Math.sin(t * Math.PI * curtain.waves + time * 0.13 * curtain.direction + curtain.phase) +
                  curtain.wobble * 0.18 * Math.sin(t * Math.PI * (curtain.waves * 2 + 1) - time * 0.08 * curtain.direction + curtain.phase * 2)
                );
                const baseY = auroraHeight * (
                  curtain.baseStart +
                  (curtain.baseEnd - curtain.baseStart) * t +
                  0.035 * Math.sin(t * Math.PI * 5 - time * 0.1 * curtain.direction + curtain.phase)
                );
                // This high-frequency signal is defined per ray, independently of
                // the curve geometry. It makes filaments visible throughout the sash;
                // geometric bunching then adds extra brightness at the folds.
                const filamentSignal = Math.max(0, Math.min(1,
                  0.42 +
                  0.34 * Math.sin(t * 67 * auroraTuning.filamentDensity + 3.1 * Math.sin(t * 13 + curtain.phase) + 1.1 * Math.sin(t * 37 - curtain.phase) + time * 0.18 * curtain.direction + curtain.phase * 3) +
                  0.18 * Math.sin(t * 139 * auroraTuning.filamentDensity - time * 0.12 * curtain.direction + curtain.phase * 7) +
                  0.12 * Math.sin(t * 227 * auroraTuning.filamentDensity + time * 0.07 * curtain.direction + curtain.phase),
                ));
                // The steep curve leaves a lot of dim rays and just a few bright ones.
                const filament = Math.pow(filamentSignal, 6);
                // One narrow, independently moving peak per curtain restores the rare
                // bright cores without lifting the many dim surrounding filaments.
                const brightCore = Math.pow(Math.max(0,
                  Math.sin(t * (12.7 + curtain.waves * 0.37) + curtain.phase * 1.9 + time * 0.09 * curtain.direction),
                ), 18);
                const widthSignal = 0.5 + 0.5 * Math.sin(t * 31 + 1.4 * Math.sin(t * 11 + curtain.phase) - time * 0.05 * curtain.direction);
                const filamentWidth = auroraTuning.filamentLineWidth * (0.7 + 2.1 * Math.pow(widthSignal, 4));
                // Fast height changes keep every ray's soft end independent; the sheet
                // therefore dissolves upward instead of ending in one scalloped outline.
                const feather =
                  0.5 +
                  0.28 * Math.sin(t * 47 - time * 0.11 + curtain.phase * 5) +
                  0.22 * Math.sin(t * 103 + time * 0.16 + curtain.phase);
                const heightSignal = Math.max(0, Math.sin(t * 57 + 1.2 * Math.sin(t * 17 + curtain.phase) - time * 0.09 * curtain.direction));
                const rayHeight = auroraHeight * (
                  0.17 +
                  0.15 * (0.5 + 0.5 * Math.sin(t * 13 - time * 0.14 * curtain.direction + curtain.phase)) +
                  0.17 * Math.max(0, feather) +
                  0.35 * Math.pow(heightSignal, 5)
                );
                const topY = Math.max(0, baseY - rayHeight);
                const bottomY = Math.min(auroraHeight, baseY + rayHeight * 0.22);
                const ray = auroraRays[rayCount] || (auroraRays[rayCount] = {});
                ray.x = x;
                ray.topY = topY;
                ray.bottomY = bottomY;
                ray.edgeFade = edgeFade;
                ray.filament = filament;
                ray.brightCore = brightCore;
                ray.filamentWidth = filamentWidth;
                rayCount += 1;
              }

              // A broad, low-alpha pass forms the continuously visible curtain. Blur
              // each ray so even tightly bunched folds remain soft on both sides.
              auroraBodyContext.lineWidth = auroraTuning.bodyLineWidth;
              for (let index = 0; index < rayCount; index += auroraTuning.bodySampleStride) {
                const ray = auroraRays[index];
                // These per-ray gradients allocate roughly 300 gradients and 1,800 colour
                // strings per frame. Reviewed and retained: reuse or approximation changes
                // each ray's tuned vertical profile; this is bounded young-gen GC churn, not
                // growth or a leak. Revisit only if a real projector stutters.
                const body = auroraBodyContext.createLinearGradient(ray.x, ray.topY, ray.x, ray.bottomY);
                body.addColorStop(0, "rgba(255, 105, 170, 0)");
                body.addColorStop(0.07, `rgba(255, 105, 170, ${ray.edgeFade * 0.003 * auroraTuning.brightness})`);
                body.addColorStop(0.13, "rgba(255, 105, 170, 0)");
                body.addColorStop(0.28, `rgba(0, 235, 72, ${ray.edgeFade * 0.072 * auroraTuning.brightness})`);
                body.addColorStop(0.69, `rgba(0, 245, 68, ${ray.edgeFade * 0.11 * auroraTuning.brightness})`);
                body.addColorStop(0.84, `rgba(0, 225, 58, ${ray.edgeFade * 0.082 * auroraTuning.brightness})`);
                body.addColorStop(1, "rgba(0, 225, 58, 0)");
                auroraBodyContext.globalAlpha = 1;
                auroraBodyContext.strokeStyle = body;
                auroraBodyContext.beginPath();
                auroraBodyContext.moveTo(ray.x, ray.topY);
                auroraBodyContext.lineTo(ray.x, ray.bottomY);
                auroraBodyContext.stroke();
              }

              // Broken, drifting cross-streaks bind neighbouring rays without turning
              // the body into a flat, foggy wash. Their uneven heights and slopes keep
              // the connections embedded in the curtain's folds.
              auroraFilamentContext.lineWidth = 0.8;
              for (let index = 0; index + 6 < rayCount; index += 3) {
                const bridgeSignal = Math.max(0, Math.sin(
                  index * 0.83 + 1.7 * Math.sin(index * 0.19 + curtain.phase) + time * 0.21 * curtain.direction + curtain.phase * 4,
                ));
                if (bridgeSignal < 0.42) continue;
                const start = auroraRays[index];
                const end = auroraRays[index + 6];
                const bridgeHeight = 0.34 + 0.34 * (0.5 + 0.5 * Math.sin(index * 0.37 + time * 0.17 * curtain.direction));
                const startY = start.topY + (start.bottomY - start.topY) * bridgeHeight;
                const endY = end.topY + (end.bottomY - end.topY) * (
                  bridgeHeight + 0.13 * Math.sin(index * 0.61 - time * 0.14 * curtain.direction + curtain.phase)
                );
                auroraFilamentContext.strokeStyle = `rgba(0, 255, 76, ${
                  start.edgeFade * end.edgeFade * bridgeSignal * 0.08 * auroraTuning.brightness
                })`;
                auroraFilamentContext.beginPath();
                auroraFilamentContext.moveTo(start.x, startY);
                auroraFilamentContext.quadraticCurveTo(
                  (start.x + end.x) / 2,
                  (startY + endY) / 2 + auroraHeight * 0.025 * Math.sin(index * 0.49 + time * 0.12 * curtain.direction),
                  end.x,
                  endY,
                );
                auroraFilamentContext.stroke();
              }

              // A separate, smaller blur leaves a few soft filaments within the sheet.
              for (let index = 0; index < rayCount; index += 1) {
                const ray = auroraRays[index];
                auroraFilamentContext.lineWidth = ray.filamentWidth;
                const core = auroraFilamentContext.createLinearGradient(ray.x, ray.topY, ray.x, ray.bottomY);
                core.addColorStop(0, "rgba(0, 255, 92, 0)");
                core.addColorStop(0.52, `rgba(0, 255, 92, ${ray.edgeFade * (ray.filament * 0.032 + ray.brightCore * 0.048) * auroraTuning.brightness * auroraTuning.filamentStrength})`);
                core.addColorStop(0.76, `rgba(0, 255, 76, ${ray.edgeFade * (ray.filament * 0.078 + ray.brightCore * 0.102) * auroraTuning.brightness * auroraTuning.filamentStrength})`);
                core.addColorStop(1, "rgba(0, 255, 76, 0)");
                auroraFilamentContext.globalAlpha = 1;
                auroraFilamentContext.strokeStyle = core;
                auroraFilamentContext.beginPath();
                auroraFilamentContext.moveTo(ray.x, ray.topY);
                auroraFilamentContext.lineTo(ray.x, ray.bottomY);
                auroraFilamentContext.stroke();
              }
            }

            auroraContext.globalCompositeOperation = "lighter";
            auroraContext.filter = `blur(${auroraTuning.bodyBlur}px)`;
            auroraContext.drawImage(auroraBodyCanvas, 0, 0);
            auroraContext.filter = `blur(${auroraTuning.filamentBlur}px)`;
            auroraContext.drawImage(auroraFilamentCanvas, 0, 0);
            auroraContext.globalAlpha = 1;
            auroraContext.globalCompositeOperation = "source-over";
            auroraContext.filter = "none";
            context.drawImage(auroraCanvas, 0, 0, frame.width, frame.height);
          },
        });

        const meteors = [];
        const meteorIntervalMin = 60;
        const meteorIntervalMax = 180;
        let nextMeteorTime = meteorIntervalMin + Math.random() * (meteorIntervalMax - meteorIntervalMin);

        function scheduleMeteor(time) {
          nextMeteorTime = time + meteorIntervalMin + Math.random() * (meteorIntervalMax - meteorIntervalMin);
        }

        function createMeteor(frame) {
          const shortSide = Math.min(frame.width, frame.height);
          const angle = Math.random() * Math.PI * 2;
          const speed = shortSide * (0.55 + Math.random() * 0.15);

          meteors.push({
            startX: Math.random() * frame.width,
            startY: Math.random() * frame.height,
            directionX: Math.cos(angle),
            directionY: Math.sin(angle),
            speed,
            trailLength: shortSide * (0.15 + Math.random() * 0.1),
            startedAt: frame.time,
            duration: 0.7 + Math.random() * 0.4,
          });
        }

        layers.push({
          update(frame) {
            if (frame.time >= nextMeteorTime) {
              createMeteor(frame);
              scheduleMeteor(frame.time);
            }

            for (let index = meteors.length - 1; index >= 0; index -= 1) {
              const meteor = meteors[index];
              if (frame.time - meteor.startedAt > meteor.duration) {
                meteors.splice(index, 1);
              }
            }
          },
          draw(context, frame) {
            for (const meteor of meteors) {
              const elapsed = frame.time - meteor.startedAt;
              const progress = Math.min(1, elapsed / meteor.duration);
              const brightness = progress < 0.15
                ? progress / 0.15
                : 1 - (progress - 0.15) / 0.85;
              const headX = meteor.startX + meteor.directionX * meteor.speed * elapsed;
              const headY = meteor.startY + meteor.directionY * meteor.speed * elapsed;
              const tailBack = Math.min(meteor.trailLength, meteor.speed * elapsed);
              const tailX = headX - meteor.directionX * tailBack;
              const tailY = headY - meteor.directionY * tailBack;

              context.save();
              context.lineCap = "round";
              if (tailX !== headX || tailY !== headY) {
                const gradient = context.createLinearGradient(tailX, tailY, headX, headY);
                gradient.addColorStop(0, "rgba(180, 215, 255, 0)");
                gradient.addColorStop(0.75, `rgba(210, 230, 255, ${0.35 * brightness})`);
                gradient.addColorStop(1, `rgba(255, 255, 255, ${brightness})`);
                context.strokeStyle = gradient;
                context.lineWidth = 1.5;
                context.beginPath();
                context.moveTo(tailX, tailY);
                context.lineTo(headX, headY);
                context.stroke();
              }

              context.fillStyle = `rgba(255, 255, 255, ${brightness})`;
              context.shadowColor = "rgba(190, 220, 255, 0.9)";
              context.shadowBlur = 8;
              context.beginPath();
              context.arc(headX, headY, 1.5, 0, Math.PI * 2);
              context.fill();
              context.restore();
            }
          },
        });

        function resizeCanvas() {
          width = window.innerWidth;
          height = window.innerHeight;
          pixelRatio = window.devicePixelRatio || 1;
          canvas.width = Math.round(width * pixelRatio);
          canvas.height = Math.round(height * pixelRatio);
        }

        function render(frameTime) {
          const deltaTime = lastFrameTime ? (frameTime - lastFrameTime) / 1000 : 0;
          lastFrameTime = frameTime;
          const frame = { time: frameTime / 1000, deltaTime, width, height, lat: LAT, lon: LON };

          context.setTransform(pixelRatio, 0, 0, pixelRatio, 0, 0);
          context.fillStyle = "#000";
          context.fillRect(0, 0, width, height);

          for (const layer of layers) {
            layer.update?.(frame);
            layer.draw?.(context, frame);
          }

          requestAnimationFrame(render);
        }

        let cursorTimer;
        function showCursor() {
          document.body.classList.remove("cursor-hidden");
          clearTimeout(cursorTimer);
          cursorTimer = setTimeout(() => document.body.classList.add("cursor-hidden"), 2000);
        }

        window.addEventListener("resize", resizeCanvas);
        window.addEventListener("mousemove", showCursor);
        resizeCanvas();
        showCursor();
        requestAnimationFrame(render);
      })();
    </script>
